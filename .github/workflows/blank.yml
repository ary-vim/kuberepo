name: Build and Push to ACR

on:
  push:
    branches:
      - main   # Trigger on pushes to main branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # ✅ Required for OIDC login
      contents: read       # ✅ Allows checkout of code

    steps:
      # Step 1: Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Azure Login (OIDC)
      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Step 3: Log in to ACR
      - name: ACR Login
        run: az acr login --name acrimg1

      # Step 4: Build Docker image
      - name: Build Docker image
        run: docker build -t acrimg1.azurecr.io/scheldon:v2 -f kubernetes/Dockerfile .

      # Step 5: Push Docker image to ACR
      - name: Push Docker image
        run: |
          docker push acrimg.azurecr.io/scheldon:v2
